name: Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish
      run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Rename binary
      run: mv ./publish/Glint ./publish/glint-${{ matrix.rid }}

    - name: Install FPM (Linux)
      if: matrix.rid == 'linux-x64'
      run: sudo apt-get update && sudo apt-get install -y ruby rubygems && sudo gem install fpm

    - name: Create RPM Package (Linux)
      if: matrix.rid == 'linux-x64'
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        fpm -s dir -t rpm -n glint -v $VERSION \
          --description "A fast, minimal screenshot annotation tool" \
          --url "https://github.com/${{ github.repository }}" \
          -p ./publish/glint-$VERSION-x86_64.rpm \
          ./publish/glint-${{ matrix.rid }}=/usr/bin/glint

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./publish/glint-${{ matrix.rid }}
          ./publish/glint-*.rpm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
