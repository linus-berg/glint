name: Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish
      run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Rename binary
      run: mv ./publish/Glint ./publish/glint-${{ matrix.rid }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/glint-${{ matrix.rid }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
